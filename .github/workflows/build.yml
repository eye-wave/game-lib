name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}
          cache-all-crates: true
          cache-targets: true

      - name: Linux tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools libvulkan1 libxcb1 zip \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            upx-ucl

      - name: Build sstrip
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 https://github.com/BR903/ELFkickers
          make -C ELFkickers
          sudo install -m755 "$(find ELFkickers -name sstrip -type f -perm -u+x | head -1)" /usr/local/bin/sstrip

      - name: Install UPX
        if: runner.os == 'Windows'
        run: choco install upx -y --no-progress

      - name: Signing setup
        if: runner.os == 'Windows'
        shell: bash
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
        run: |
          if [ -n "$PFX_B64" ]; then
            echo "$PFX_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            echo "PFX=$(cygpath -w "$RUNNER_TEMP/cert.pfx")" >> "$GITHUB_ENV"

            sdk="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 | sort -V | tail -1)"
            echo "$(cygpath -w "$sdk")" >> "$GITHUB_PATH"
          fi

      - name: Build bundle
        env:
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: just bundle

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: target/bundle
          if-no-files-found: error

      - name: Download link in run summary
        run: echo "[bundle-${{ matrix.target }}](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/bundle-${{ matrix.target }}.zip)" >> "$GITHUB_STEP_SUMMARY"
