
[package]
name = "gfx"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = { workspace = true }
ecs = { path = "../ecs" }
errors = { path = "../errors" }
math = { path = "../math" }
platform = { path = "../platform" }
shader = { path = "../shader" }
vulkan-sys = { path = "../vulkan-sys" }

[build-dependencies]
shader = { path = "../shader", features = ["build"] }

[features]
default = ["cam2d", "multicam", "post", "mouse", "fixed_input", "lit"]
cam2d = []
cam3d = []
cull = []
multicam = []
post = []
mouse = []
fixed_input = []
lit = []
aa = [] # 4x MSAA in the scene pass (alpha-to-coverage smooths MSDF text)
text = [
] # MSDF text: `Atlas`, `Material::msdf`; the `font` crate makes the atlas and the meshes
