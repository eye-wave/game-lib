[package]
name = "media"
version = "0.1.0"
edition = "2024"

[features]
default = ["image", "audio", "font"]
# `image`: image decoding, and `Font` (text layout from any grid image, e.g. a pixel font's PNG: plain Rust, no webview).
# `audio`: sound decoding. `font`: `Loader::font`, the page draws a TTF/OTF/WOFF into such a grid.
# Each adds its part of the page script; off = no `Loader::image` / `sound` / `font`.
image = []
audio = []
font = ["image"]

[dependencies]
errors = { path = "../errors" }
platform = { path = "../platform" }

[target.'cfg(windows)'.dependencies]
win32-sys = { path = "../win32-sys" }
