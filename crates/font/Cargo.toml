
[package]
name = "font"
version = "0.1.0"
edition = "2024"

[dependencies]
# only for `build`: bakes atlases at compile time, never linked into a game
msdfgen = { version = "0.2.1", default-features = false, features = [
  "ttf-parser",
], optional = true }
ttf-parser = { version = "0.18", optional = true }
flate2 = { version = "1", optional = true } # .woff (what @fontsource ships)
serde_json = { version = "1", optional = true } # only for `bitmap`

[features]
# `font::build(..)` for a build.rs; turns std on
build = ["dep:msdfgen", "dep:ttf-parser", "dep:flate2"]
# bitmap fonts instead of MSDF: `font::build(..)` converts BMFont-style JSON, nothing else is compiled or linked.
# Exclusive with `build`; turns std on
bitmap = ["dep:serde_json"]
