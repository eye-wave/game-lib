
cargo-features = ["profile-rustflags", "panic-immediate-abort"]

[package]
name = "stupid-game"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
ash = { version = "0.38", default-features = false }

[dependencies]
ash = { workspace = true }
platform = { path = "crates/platform" }
shader = { path = "crates/shader" }
vulkan-sys = { path = "crates/vulkan-sys" }

[build-dependencies]
shader = { path = "crates/shader", features = ["build"] }

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "immediate-abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
