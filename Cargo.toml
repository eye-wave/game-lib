
cargo-features = ["profile-rustflags", "panic-immediate-abort"]

[package]
name = "stupid-game"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]

[workspace.dependencies]
ash = { version = "0.38", default-features = false }
error-codes = { path = "./crates/error-codes" }

[dependencies]
ecs = { path = "crates/ecs" }
gfx = { path = "crates/gfx" }
platform = { path = "crates/platform" }
shader = { path = "crates/shader" }

[build-dependencies]
shader = { path = "crates/shader", features = ["build"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "immediate-abort"
strip = true
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
