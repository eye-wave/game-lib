cargo-features = ["profile-rustflags", "panic-immediate-abort"]

[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.dependencies]
ash = { version = "0.38", default-features = false }

[profile.dev]
panic = "immediate-abort"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "immediate-abort"
strip = "debuginfo"                          # "true" links ~15KB of libm here; the Makefile strips symbols anyway
debug = false
overflow-checks = false
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
