[package]
name = "bitmap-font-example"
version = "0.1.0"
edition = "2024"

[dependencies]
ecs = { path = "../../crates/ecs" }
gfx = { path = "../../crates/gfx", default-features = false, features = [
  "cam2d",
  "text",
  "aa",
] }
media = { path = "../../crates/media" }
platform = { path = "../../crates/platform", features = ["rt"] }

[build-dependencies]
win32-sys = { path = "../../crates/win32-sys", features = ["build"] }
