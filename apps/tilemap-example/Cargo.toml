[package]
name = "tilemap-example"
version = "0.1.0"
edition = "2024"

[dependencies]
ecs = { path = "../../crates/ecs" }
gfx = { path = "../../crates/gfx", default-features = false, features = [
  "cam2d",
  "mouse", # Input::window_size
  "post",  # PostProcess: the fade
  "text",  # the dialogue font (brings `textures` along)
] }
math = { path = "../../crates/math" }
media = { path = "../../crates/media", default-features = false, features = ["image"] } # pixel font: layout only, no sound or TTF decoder
platform = { path = "../../crates/platform", features = ["rt"] }
shader = { path = "../../crates/shader" }
tilemap = { path = "../../crates/tilemap" }

[build-dependencies]
shader = { path = "../../crates/shader", features = ["build"] }
tilemap = { path = "../../crates/tilemap", default-features = false, features = ["build"] } # bakes assets/level.txt
win32-sys = { path = "../../crates/win32-sys", features = ["build"] }
