
[package]
name = "terrain-3d"
version = "0.1.0"
edition = "2024"

[dependencies]
ecs = { path = "../../crates/ecs" }
gfx = { path = "../../crates/gfx", default-features = false, features = [
  "aa",
  "cam2d", # the HUD
  "cam3d",
  "cull",
  "fixed_input",
  "lit",
  "mouse",
  "ranges", # the terrain draws only its visible chunks
  "multicam", # the HUD is its own camera with a viewport
  "text", # HUD digits
] }
media = { path = "../../crates/media", default-features = false, features = ["font"] } # TTF -> glyph grid for the HUD
math = { path = "../../crates/math" }
platform = { path = "../../crates/platform", features = ["rt"] }
shader = { path = "../../crates/shader" }

[build-dependencies]
shader = { path = "../../crates/shader", features = ["build"] }
win32-sys = { path = "../../crates/win32-sys", features = ["build"] }
